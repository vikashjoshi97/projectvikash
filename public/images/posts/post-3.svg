<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#0f172a" />
  
  <!-- Desk surface line -->
  <rect x="0" y="380" width="600" height="220" fill="url(#deskGrad)" />
  <line x1="0" y1="380" x2="600" y2="380" stroke="#374151" stroke-width="2" />
  
  <!-- Monitor Setup -->
  <rect x="150" y="120" width="300" height="190" rx="8" fill="#020617" stroke="#475569" stroke-width="2" />
  <rect x="160" y="130" width="280" height="170" rx="4" fill="#090d16" />
  
  <!-- Monitor screen content: Code editor -->
  <line x1="175" y1="150" x2="240" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="175" y1="165" x2="310" y2="165" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="190" y1="180" x2="350" y2="180" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />
  <line x1="190" y1="195" x2="280" y2="195" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="175" y1="215" x2="230" y2="215" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
  <line x1="175" y1="235" x2="370" y2="235" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="175" y1="250" x2="330" y2="250" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  
  <!-- Stand -->
  <rect x="285" y="310" width="30" height="70" fill="#334155" />
  <ellipse cx="300" cy="380" rx="55" ry="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

  <!-- Keyboard on desk -->
  <rect x="200" y="420" width="200" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <!-- Keys grid -->
  <g fill="#334155">
    <rect x="210" y="428" width="15" height="10" rx="2" />
    <rect x="230" y="428" width="15" height="10" rx="2" />
    <rect x="250" y="428" width="15" height="10" rx="2" />
    <rect x="270" y="428" width="15" height="10" rx="2" />
    <rect x="290" y="428" width="15" height="10" rx="2" />
    <rect x="310" y="428" width="15" height="10" rx="2" />
    <rect x="330" y="428" width="15" height="10" rx="2" />
    <rect x="350" y="428" width="15" height="10" rx="2" />
    <rect x="370" y="428" width="15" height="10" rx="2" />
    
    <rect x="245" y="460" width="110" height="12" rx="3" fill="#f8fafc" />
  </g>

  <!-- Coffee mug -->
  <circle cx="450" cy="450" r="18" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <circle cx="450" cy="450" r="13" fill="#451a03" />

  <!-- Atmospheric warm light -->
  <ellipse cx="450" cy="180" rx="60" ry="60" fill="#fef08a" opacity="0.08" />
  <text x="300" y="550" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">WORKSTATION &bull; SF STUDIO</text>
</svg>
