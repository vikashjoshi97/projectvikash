<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#18181b" />
  
  <!-- Code Tree / UI Component Tree Visualization -->
  <g transform="translate(60, 80)">
    <!-- Root node -->
    <rect x="180" y="0" width="120" height="40" rx="8" fill="#27272a" stroke="#71717a" stroke-width="1.5" />
    <text x="240" y="25" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#fafafa">&lt;App /&gt;</text>
    
    <!-- Lines down -->
    <path d="M 240 40 L 240 70 M 240 70 L 80 70 M 240 70 L 400 70 M 80 70 L 80 100 M 240 70 L 240 100 M 400 70 L 400 100" fill="none" stroke="#52525b" stroke-width="1.5" />
    
    <!-- Level 1 nodes -->
    <rect x="20" y="100" width="120" height="36" rx="6" fill="#3f3f46" />
    <text x="80" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8">&lt;Navbar /&gt;</text>

    <rect x="180" y="100" width="120" height="36" rx="6" fill="#3f3f46" />
    <text x="240" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#34d399">&lt;Profile /&gt;</text>

    <rect x="340" y="100" width="120" height="36" rx="6" fill="#3f3f46" />
    <text x="400" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#f472b6">&lt;Feed /&gt;</text>

    <!-- Sub nodes -->
    <path d="M 240 136 L 240 170 M 240 170 L 160 170 M 240 170 L 320 170 M 160 170 L 160 190 M 320 170 L 320 190" fill="none" stroke="#52525b" stroke-width="1.5" />
    
    <rect x="105" y="190" width="110" height="32" rx="6" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="160" y="211" text-anchor="middle" font-family="monospace" font-size="11" fill="#e4e4e7">&lt;Avatar /&gt;</text>

    <rect x="265" y="190" width="110" height="32" rx="6" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text x="320" y="211" text-anchor="middle" font-family="monospace" font-size="11" fill="#e4e4e7">&lt;Stats /&gt;</text>
  </g>

  <!-- Bottom card -->
  <rect x="60" y="380" width="480" height="140" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <text x="90" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#fafafa">Component Primitives &amp; a11y</text>
  <text x="90" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#a1a1aa">High performance, unstyled, strictly accessible headless state</text>
  <circle cx="95" cy="485" r="4" fill="#10b981" />
  <text x="110" y="490" font-family="monospace" font-size="12" fill="#10b981">100% Type-Safe &bull; Zero Re-render leaks</text>
</svg>
