<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#f1f5f9" />
  
  <!-- Wireframing Canvas Sheet -->
  <rect x="50" y="50" width="500" height="500" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Wireframe mobile screen 1 -->
  <rect x="90" y="100" width="180" height="340" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="110" y="120" width="60" height="8" rx="4" fill="#cbd5e1" />
  <rect x="110" y="145" width="140" height="80" rx="8" fill="#e2e8f0" />
  <circle cx="180" cy="185" r="14" fill="#94a3b8" />
  <rect x="110" y="240" width="100" height="10" rx="4" fill="#64748b" />
  <rect x="110" y="260" width="140" height="6" rx="3" fill="#cbd5e1" />
  <rect x="110" y="275" width="120" height="6" rx="3" fill="#cbd5e1" />
  <rect x="110" y="300" width="140" height="32" rx="8" fill="#0f172a" />
  
  <!-- Wireframe mobile screen 2 -->
  <rect x="330" y="100" width="180" height="340" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="420" cy="150" r="30" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="360" y="195" width="120" height="12" rx="4" fill="#0f172a" />
  <rect x="375" y="215" width="90" height="8" rx="4" fill="#94a3b8" />
  <rect x="350" y="245" width="140" height="40" rx="8" fill="#e2e8f0" />
  <rect x="350" y="295" width="140" height="40" rx="8" fill="#e2e8f0" />
  
  <!-- Connecting Arrow Flow -->
  <path d="M 270 270 L 330 270" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="328,265 338,270 328,275" fill="#3b82f6" />

  <text x="90" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#0f172a">UX Wireframing &amp; Flow Architecture</text>
  <text x="90" y="515" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748b">Rapid fidelity prototyping before pixel-perfection.</text>
</svg>
