<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="p1Card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#p1Bg)" />
  
  <!-- Subtle Grid -->
  <g stroke="#27272a" stroke-width="1" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="600" />
    <line x1="180" y1="0" x2="180" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="420" y1="0" x2="420" y2="600" />
    <line x1="540" y1="0" x2="540" y2="600" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="420" x2="600" y2="420" />
    <line x1="0" y1="540" x2="600" y2="540" />
  </g>

  <!-- Design System Token Card -->
  <rect x="90" y="90" width="420" height="420" rx="16" fill="url(#p1Card)" stroke="#3f3f46" stroke-width="1.5" />
  
  <!-- Design System Header -->
  <circle cx="130" cy="130" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="150" cy="130" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="170" cy="130" r="6" fill="#10b981" opacity="0.8"/>
  <line x1="90" y1="160" x2="510" y2="160" stroke="#3f3f46" stroke-width="1" />

  <!-- Color Swatches Row -->
  <rect x="130" y="190" width="65" height="45" rx="8" fill="#fafafa" />
  <rect x="205" y="190" width="65" height="45" rx="8" fill="#a1a1aa" />
  <rect x="280" y="190" width="65" height="45" rx="8" fill="#52525b" />
  <rect x="355" y="190" width="65" height="45" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <rect x="430" y="190" width="40" height="45" rx="8" fill="#09090b" stroke="#52525b" stroke-width="1"/>

  <!-- Typography Scale Block -->
  <text x="130" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#fafafa">Aa Display 32</text>
  <text x="130" y="320" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#a1a1aa">Heading 20 / 1.4 Line Height</text>
  <text x="130" y="355" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#71717a">Body copy regular 16 with optical tracking</text>

  <!-- Button and badge preview -->
  <rect x="130" y="400" width="140" height="44" rx="10" fill="#fafafa" />
  <text x="200" y="427" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#09090b">Primary Action</text>

  <rect x="285" y="400" width="130" height="44" rx="10" fill="#27272a" stroke="#52525b" stroke-width="1" />
  <text x="350" y="427" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#fafafa">Secondary</text>

  <rect x="425" y="408" width="45" height="28" rx="14" fill="#3f3f46" />
  <text x="447" y="426" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fafafa">v2.4</text>
</svg>
