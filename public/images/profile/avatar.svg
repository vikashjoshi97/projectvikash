<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Geometric Decorative Lines -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#3f3f46" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="200" r="130" fill="#18181b" stroke="#27272a" stroke-width="2" filter="url(#subtleGlow)"/>

  <!-- Stylized Monogram / Silhouette -->
  <g transform="translate(200, 195) scale(0.95)">
    <!-- Base geometric avatar crest -->
    <path d="M -50 -40 L -25 45 L 0 -10 L 25 45 L 50 -40" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="-60" r="14" fill="#fafafa" />
    <circle cx="-50" cy="-40" r="5" fill="#a1a1aa" />
    <circle cx="50" cy="-40" r="5" fill="#a1a1aa" />
  </g>

  <!-- Typography Monogram Bottom -->
  <text x="200" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7" letter-spacing="4">VIKASH JOSHI</text>
  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#71717a" letter-spacing="2">CREATOR &bull; TECH</text>
</svg>
