<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p6Bg)" />
  
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="680" height="400" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top address bar -->
    <rect x="20" y="20" width="640" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="35" y="28" width="60" height="28" rx="4" fill="#10b981" />
    <text x="65" y="46" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">POST</text>
    <text x="110" y="47" font-family="monospace" font-size="12" fill="#f8fafc">https://api.gateway.internal/v2/telemetry/stream</text>
    
    <rect x="560" y="28" width="85" height="28" rx="4" fill="#3b82f6" />
    <text x="602" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">SEND ↵</text>

    <!-- Split view JSON output -->
    <rect x="20" y="80" width="310" height="295" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="110" font-family="monospace" font-size="11" fill="#64748b">// REQUEST PAYLOAD</text>
    <text x="35" y="135" font-family="monospace" font-size="11" fill="#38bdf8">{</text>
    <text x="50" y="160" font-family="monospace" font-size="11" fill="#94a3b8">  "session_id": "usr_9918",</text>
    <text x="50" y="185" font-family="monospace" font-size="11" fill="#94a3b8">  "metrics": ["fps", "ttfb"],</text>
    <text x="50" y="210" font-family="monospace" font-size="11" fill="#94a3b8">  "realtime": true</text>
    <text x="35" y="235" font-family="monospace" font-size="11" fill="#38bdf8">}</text>

    <rect x="350" y="80" width="310" height="295" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="365" y="110" font-family="monospace" font-size="11" fill="#10b981">// 200 OK (14ms &bull; 1.2 KB)</text>
    <text x="365" y="135" font-family="monospace" font-size="11" fill="#34d399">{</text>
    <text x="380" y="160" font-family="monospace" font-size="11" fill="#f8fafc">  "status": "connected",</text>
    <text x="380" y="185" font-family="monospace" font-size="11" fill="#f8fafc">  "nodes_active": 42,</text>
    <text x="380" y="210" font-family="monospace" font-size="11" fill="#f8fafc">  "latency_p95": 8.4</text>
    <text x="365" y="235" font-family="monospace" font-size="11" fill="#34d399">}</text>
  </g>
</svg>
