<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#18181b" />
  
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="680" height="400" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Controls top -->
    <rect x="30" y="30" width="620" height="60" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#fafafa">TYPECRAFT LAB</text>
    
    <!-- Sliders mock -->
    <text x="220" y="65" font-family="monospace" font-size="11" fill="#a1a1aa">WEIGHT: 700</text>
    <line x1="310" y1="60" x2="420" y2="60" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>
    <circle cx="390" cy="60" r="7" fill="#fafafa" />

    <text x="460" y="65" font-family="monospace" font-size="11" fill="#a1a1aa">SLANT: 0°</text>
    <line x1="530" y1="60" x2="620" y2="60" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>
    <circle cx="530" cy="60" r="7" fill="#fafafa" />

    <!-- Specimen Area -->
    <text x="50" y="180" font-family="'Georgia', serif" font-size="64" font-weight="700" fill="#fafafa">Modular Rhythm</text>
    <text x="50" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="600" fill="#a1a1aa">Optical Scale &amp; Structural Harmony</text>
    <text x="50" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="400" fill="#71717a">The quick brown fox jumps over the lazy dog &bull; 0123456789</text>
    
    <rect x="50" y="330" width="130" height="36" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="115" y="353" text-anchor="middle" font-family="monospace" font-size="12" fill="#fafafa">Export CSS @font</text>
  </g>
</svg>
